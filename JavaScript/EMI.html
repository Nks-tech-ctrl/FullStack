<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            background-color: aliceblue;
            min-height: 110vh;
            display: grid;
            place-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        div {
            width: 300px;
            padding: 30px;
            background: whitesmoke;
            border-radius: 15px;
            box-shadow: 0 10px 24px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: rgb(40, 167, 124);
        }
    </style>
</head>

<body>
    <div>
        <h1>EMI Calculator</h1>
        <label for="">Loan Amount</label>
        <span id="loanValue">₹ 10,00,000</span>
        <input type="range" id="amount" min="100000" max="5000000" step="50000" value="1000000">
        <br>
        <label for="">Interest Rate</label>
        <span id="interest">6.5%</span>
        <input type="range" id="interest_rate" min="1" max="30" step="0.1" value="6.5">
        <br><br>
        <label for="">Loan Tenure</label>
        <span id="tenure">1year </span>
        <input type="range" id="loan_tenure" min="1" max="30" step="1" value="1">

        <br>
        <p>Monthly EMI <span id="emi"></span></p>
        <p>Principal Amount <span id="principal_amount"></span></p>
        <p>Total Interest <span id="total_interest"></span></p>
        <p>Total Amount <span id="total_amount"></span></p>


    </div>
    <script>
        var Amount = document.getElementById("amount").value;
        amount.addEventListener("Input", update_values)
        var Interest = document.getElementById("interest").value;
        Interest.addEventListener("Input", update_values)
        var Tenure = document.getElementById("loan_tenure").value;
        Tenure.addEventListener("Input", update_values)

        function update_values() {
            document.getElementById("amount").innerHTML="$"+Number(amount.value)
        }


    </script>
</body>

</html>
