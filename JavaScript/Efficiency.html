<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company-Effiecency</title>
    <style>
         fieldset {
            display: flex; 
            flex-direction: column;
            margin: 0 auto;
            margin-top: 100px;
            background-color: whitesmoke;
            width: 280px; 
            border: none;
            border-radius: 10px;
            padding: 20px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
        input {
            width: 90%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 5px;
        }
         button {
            display: block; 
            margin: 15px auto 0 auto; 
            background-color: rgba(95, 95, 141, 0.795);
            color: white; 
            border: none;
            border-radius: 10px;
            padding: 10px;
            width: 100px;
            cursor: pointer; 
        }
         button:hover {
            background-color: rgb(145, 59, 145); 
        }

        legend {
            background-color: rgba(201, 119, 218, 0.877);
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
        }

        #result {
            text-align: center; 
            font-size: 24px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <fieldset>
        <legend>Efficiency</legend>
        <label for="">Enter Working Hours</label>
        <input type="number" name="" id="workHours">
        <button onclick="efficency()">Submit</button>
        <br><br>
        <h1 id="result"></h1>
    </fieldset>
    <script>
        function efficency() {
            var Working_Hour = parseFloat(document.getElementById("workHours").value)
            if (Working_Hour >=2 && Working_Hour <= 3) {
                document.getElementById("result").innerHTML = "Worker is Highly efficient"
            } else if (Working_Hour > 3 && Working_Hour <= 4) {
                document.getElementById("result").innerHTML = "worker should improve working efficency"
            } else if (Working_Hour > 4 && Working_Hour <= 5) {
                document.getElementById("result").innerHTML = "Worker is needed training to ipmrove worker efficiency"
            } else if (Working_Hour > 5) {
                document.getElementById("result").innerHTML = "Worker has to leave Company!"
            } else {
                document.getElementById("result").innerHTML="Invalid input"
            }
        }
    </script>
</body>

</html>
