<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <div>

        <label for="">First Number</label>
        <input type="number" id="num1" placeholder="Enter first num">
        <br>
        <label for="">Second Number</label>
        <input type="number" id="num2" placeholder="Enter second number">
        <br><br>
        <label for="">Result:</label>
        <input type="number" id="result">
        <br><br>
        <button onclick="add()">Add</button>
        <button onclick="sub()">Sub</button>
        <button onclick="multiply()">Multiply</button>
        <button onclick="division()">Division</button>
    </div>
    <script>
        function add() {

            x = Number(document.getElementById("num1").value);
            y = Number(document.getElementById("num2").value);
            result = Number(document.getElementById("result").value=x+y);
            // document.getElementById("result").value = x + y;
        }
        function sub() {
            x = Number(document.getElementById("num1").value);
            y = Number(document.getElementById("num2").value);
            result = Number(document.getElementById("result").value);
            document.getElementById("result").value = x - y;
        }
        function multiply() {
            x = Number(document.getElementById("num1").value);
            y = Number(document.getElementById("num2").value);
            result = Number(document.getElementById("result").value);
            document.getElementById("result").value = x * y;
        }
        function division() {
            x = Number(document.getElementById("num1").value);
            y = Number(document.getElementById("num2").value);
            result = Number(document.getElementById("result").value);
            document.getElementById("result").value = x / y;
        }
    </script>
</body>

</html>
